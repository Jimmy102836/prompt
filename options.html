<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Image Prompt Extractor 设置</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-width: 420px;
        min-height: 100vh;
        margin: 0;
        padding: 42px;
        background:
          radial-gradient(circle at 14% 8%, rgba(96, 165, 250, 0.36), transparent 32%),
          radial-gradient(circle at 86% 16%, rgba(129, 140, 248, 0.28), transparent 34%),
          radial-gradient(circle at 55% 95%, rgba(45, 212, 191, 0.18), transparent 34%),
          linear-gradient(145deg, #f8fbff 0%, #edf4ff 45%, #fbfdff 100%);
        color: #0f172a;
      }

      main {
        width: min(760px, 100%);
      }

      .settings-card {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 34px;
        padding: 30px;
        background: rgba(255, 255, 255, 0.66);
        box-shadow: 0 34px 100px rgba(37, 99, 235, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(26px) saturate(1.35);
      }

      .settings-card::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.76), transparent 34%);
      }

      .hero {
        position: relative;
        display: flex;
        gap: 16px;
        align-items: center;
        margin-bottom: 28px;
      }

      .logo-mark {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 20px;
        background: linear-gradient(145deg, #67e8f9 0%, #2563eb 52%, #4f46e5 100%);
        color: white;
        box-shadow: 0 18px 42px rgba(37, 99, 235, 0.36);
        font-size: 34px;
        font-weight: 950;
        letter-spacing: -0.08em;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: -0.045em;
      }

      p {
        max-width: 620px;
        margin: 0;
        color: #64748b;
        line-height: 1.55;
      }

      form {
        position: relative;
        display: grid;
        gap: 18px;
      }

      label {
        display: grid;
        gap: 8px;
        color: #0f172a;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      input,
      select {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.34);
        border-radius: 16px;
        padding: 13px 14px;
        background: rgba(255, 255, 255, 0.72);
        color: #0f172a;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.88), 0 10px 26px rgba(15, 23, 42, 0.05);
        font: inherit;
        font-weight: 650;
        outline: none;
        transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      }

      input:focus,
      select:focus {
        border-color: rgba(37, 99, 235, 0.76);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 0 0 5px rgba(37, 99, 235, 0.14), 0 14px 34px rgba(37, 99, 235, 0.1);
      }

      .hint {
        color: #64748b;
        font-size: 13px;
        font-weight: 500;
        line-height: 1.4;
      }

      .actions {
        display: flex;
        gap: 10px;
        padding-top: 4px;
      }

      button {
        justify-self: start;
        border: 0;
        border-radius: 999px;
        padding: 12px 18px;
        background: linear-gradient(135deg, #3b82f6, #2563eb 58%, #4f46e5);
        color: white;
        cursor: pointer;
        box-shadow: 0 14px 32px rgba(37, 99, 235, 0.28);
        font: inherit;
        font-weight: 850;
        transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
      }

      button:hover {
        filter: brightness(1.04);
        transform: translateY(-1px);
        box-shadow: 0 18px 38px rgba(37, 99, 235, 0.34);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
        transform: none;
      }

      #test-connection {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        box-shadow: 0 14px 32px rgba(15, 23, 42, 0.22);
      }

      #status {
        min-height: 20px;
        font-size: 14px;
        font-weight: 650;
      }

      #status.success {
        color: #059669;
      }

      #status.error {
        color: #dc2626;
      }

      .github-link {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: fit-content;
        margin: 4px auto 0;
        padding: 10px 14px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.48);
        color: #0f172a;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.76);
        text-decoration: none;
        font-size: 13px;
        font-weight: 850;
      }

      .github-link:hover {
        background: rgba(255, 255, 255, 0.74);
      }

      .github-link svg {
        width: 17px;
        height: 17px;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="settings-card">
        <div class="hero">
          <div class="logo-mark">P</div>
          <div>
            <h1 data-i18n="optionsTitle">AI Image Prompt Extractor Settings</h1>
            <p data-i18n="optionsDescription">Enter your own OpenAI-compatible API settings. Your API key is stored in local Chrome extension storage and sent only to your configured Base URL.</p>
          </div>
        </div>

        <form id="settings-form">
        <label>
          <span data-i18n="baseUrlLabel">Base URL</span>
          <input id="base-url" name="baseUrl" type="url" autocomplete="off" placeholder="https://api.openai.com/v1" required>
          <span class="hint" data-i18n="baseUrlHint">Enter the API root, not the admin homepage. Usually: https://domain.com/v1.</span>
        </label>

        <label>
          <span data-i18n="apiKeyLabel">API Key</span>
          <input id="api-key" name="apiKey" type="password" autocomplete="off" placeholder="sk-..." required>
          <span class="hint" data-i18n="apiKeyHint">Use your own key. Do not share it with untrusted pages or people.</span>
        </label>

        <label>
          <span data-i18n="modelLabel">Model</span>
          <input id="model" name="model" type="text" autocomplete="off" data-i18n-placeholder="optionsModelPlaceholder" placeholder="gpt-4o / gpt-4.1 / vision model name" required>
          <span class="hint" data-i18n="modelHint">Choose a vision-capable model that supports image input.</span>
        </label>

        <label>
          <span data-i18n="languageLabel">Language</span>
          <select id="language" name="language">
            <option value="zh-CN" data-i18n="languageChinese">Chinese</option>
            <option value="en-US" data-i18n="languageEnglish">English</option>
          </select>
          <span class="hint" data-i18n="languageHint">Choose the settings UI language.</span>
        </label>

        <div class="actions">
          <button type="submit" data-i18n="saveButton">Save Settings</button>
          <button id="test-connection" type="button" data-i18n="testButton">Test Connection</button>
        </div>
          <div id="status" role="status" aria-live="polite"></div>
          <a class="github-link" href="https://github.com/Jimmy102836/prompt" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.15c-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.16 1.18.92-.26 1.9-.38 2.88-.39.98 0 1.96.13 2.88.39 2.2-1.49 3.16-1.18 3.16-1.18.62 1.58.23 2.75.11 3.04.74.8 1.18 1.83 1.18 3.08 0 4.42-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.52 11.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
            </svg>
            <span>GitHub</span>
          </a>
        </form>
      </section>
    </main>

    <script src="options.js"></script>
  </body>
</html>
