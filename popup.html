<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Prompt 设置</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      }

      body {
        box-sizing: border-box;
        width: 370px;
        margin: 0;
        padding: 12px;
        background:
          radial-gradient(circle at 15% 0%, rgba(96, 165, 250, 0.32), transparent 34%),
          radial-gradient(circle at 88% 18%, rgba(129, 140, 248, 0.26), transparent 30%),
          linear-gradient(145deg, #f8fbff 0%, #eef4ff 48%, #f9fbff 100%);
        color: #0f172a;
      }

      .settings-card {
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.72);
        border-radius: 24px;
        padding: 14px 16px;
        background: rgba(255, 255, 255, 0.66);
        box-shadow: 0 24px 70px rgba(37, 99, 235, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(22px) saturate(1.35);
      }

      .settings-card::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.74), transparent 36%);
      }

      .hero {
        position: relative;
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }

      .logo-mark {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 15px;
        background: linear-gradient(145deg, #67e8f9 0%, #2563eb 52%, #4f46e5 100%);
        color: white;
        box-shadow: 0 14px 34px rgba(37, 99, 235, 0.36);
        font-size: 25px;
        font-weight: 950;
        letter-spacing: -0.08em;
      }

      h1 {
        margin: 0 0 2px;
        font-size: 18px;
        letter-spacing: -0.03em;
      }

      p {
        margin: 0;
        color: #64748b;
        font-size: 12px;
        line-height: 1.35;
      }

      form {
        position: relative;
        display: grid;
        gap: 9px;
      }

      label {
        display: grid;
        gap: 5px;
        color: #0f172a;
        font-size: 12.5px;
        font-weight: 800;
        letter-spacing: -0.01em;
      }

      input,
      select {
        box-sizing: border-box;
        width: 100%;
        border: 1px solid rgba(148, 163, 184, 0.34);
        border-radius: 14px;
        padding: 9px 12px;
        background: rgba(255, 255, 255, 0.72);
        color: #0f172a;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.88), 0 8px 22px rgba(15, 23, 42, 0.05);
        font: inherit;
        font-size: 13px;
        font-weight: 650;
        outline: none;
        transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      }

      input:focus,
      select:focus {
        border-color: rgba(37, 99, 235, 0.76);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14), 0 12px 28px rgba(37, 99, 235, 0.1);
      }

      .hint {
        color: #64748b;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.25;
      }

      .actions {
        display: flex;
        gap: 9px;
        padding-top: 2px;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 10px 14px;
        background: linear-gradient(135deg, #3b82f6, #2563eb 58%, #4f46e5);
        color: #fff;
        cursor: pointer;
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.28);
        font: inherit;
        font-size: 12.5px;
        font-weight: 850;
        transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
      }

      button:hover {
        filter: brightness(1.04);
        transform: translateY(-1px);
        box-shadow: 0 16px 34px rgba(37, 99, 235, 0.34);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
        transform: none;
      }

      #test-connection {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.22);
      }

      #status {
        min-height: 16px;
        font-size: 11.5px;
        font-weight: 650;
        line-height: 1.35;
      }

      #status.success {
        color: #059669;
      }

      #status.error {
        color: #dc2626;
      }

      .github-link {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        width: fit-content;
        margin: 2px auto 0;
        padding: 8px 11px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.48);
        color: #0f172a;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.76);
        text-decoration: none;
        font-size: 12px;
        font-weight: 800;
      }

      .github-link:hover {
        background: rgba(255, 255, 255, 0.74);
      }

      .github-link svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <section class="settings-card">
      <div class="hero">
        <div class="logo-mark">P</div>
        <div>
          <h1 data-i18n="title">AI Prompt Settings</h1>
          <p data-i18n="description">Enter your own OpenAI-compatible API settings. After saving, refresh the webpage and click the Prompt button beside an image.</p>
        </div>
      </div>

      <form id="settings-form">
      <label>
        <span data-i18n="baseUrlLabel">Base URL</span>
        <input id="base-url" name="baseUrl" type="url" autocomplete="off" placeholder="https://api.openai.com/v1" required>
        <span class="hint" data-i18n="baseUrlHint">Enter the API root, not the admin homepage. Usually: https://domain.com/v1</span>
      </label>

      <label>
        <span data-i18n="apiKeyLabel">API Key</span>
        <input id="api-key" name="apiKey" type="password" autocomplete="off" placeholder="sk-..." required>
        <span class="hint" data-i18n="apiKeyHint">Stored only in local extension storage.</span>
      </label>

      <label>
        <span data-i18n="modelLabel">Model</span>
        <input id="model" name="model" type="text" autocomplete="off" data-i18n-placeholder="modelPlaceholder" placeholder="Vision-capable model name" required>
      </label>

      <label>
        <span data-i18n="languageLabel">Language</span>
        <select id="language" name="language">
          <option value="zh-CN" data-i18n="languageChinese">Chinese</option>
          <option value="en-US" data-i18n="languageEnglish">English</option>
        </select>
        <span class="hint" data-i18n="languageHint">Choose the settings UI language.</span>
      </label>

      <div class="actions">
        <button type="submit" data-i18n="saveButton">Save Settings</button>
        <button id="test-connection" type="button" data-i18n="testButton">Test Connection</button>
      </div>
        <div id="status" role="status" aria-live="polite"></div>
        <a class="github-link" href="https://github.com/Jimmy102836/prompt" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-2.15c-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.16 1.18.92-.26 1.9-.38 2.88-.39.98 0 1.96.13 2.88.39 2.2-1.49 3.16-1.18 3.16-1.18.62 1.58.23 2.75.11 3.04.74.8 1.18 1.83 1.18 3.08 0 4.42-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.52 11.52 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
          </svg>
          <span>GitHub</span>
        </a>
      </form>
    </section>

    <script src="options.js"></script>
  </body>
</html>
